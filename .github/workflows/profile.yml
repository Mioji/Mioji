# Verifies every change and refreshes the public metrics snapshot daily.
#
# verify   Lint, type-check and test the generator, then prove that the
#          committed generated files match the committed inputs. Runs for
#          pushes, pull requests, the schedule and manual dispatch.
# refresh  On main only: fetch a new snapshot, re-render and commit the
#          result. It depends on verify, so a broken generator never
#          publishes, and the generator itself needs no third-party
#          packages, so nothing is installed.

name: Profile

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

# Runs on main are queued rather than cancelled so that a refresh is never
# interrupted between commit and push; superseded pull request runs are
# cancelled because only their latest commit matters.
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # The oldest and the newest supported versions: some defects, such as
      # unclosed responses, surface only on newer interpreters. A failure on
      # one version must not cancel the result of the other.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tooling/requirements-dev.txt

      - name: Install development tools
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r tooling/requirements-dev.txt

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest

      - name: Verify generated files
        run: python tooling/generate.py --check

  refresh:
    name: Refresh snapshot
    needs: verify
    if: >-
      github.repository == 'Mioji/Mioji'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Commits the refreshed files and pushes them to main.
    steps:
      # The final step pushes with the persisted job token. The job uploads
      # no artifacts, so the credential in .git/config cannot leak that way.
      - name: Check out # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets git pull --rebase merge concurrent pushes cleanly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch and render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tooling/generate.py --fetch
          python tooling/generate.py --check

      - name: Commit and push
        run: |
          # --all also stages deletions of orphaned generated files.
          git add --all -- README.md locales/readme assets/generated configs/data/snapshot.json
          if git diff --cached --quiet; then
            echo "Profile is already up to date."
            exit 0
          fi
          git -c user.name='Mioji [Bot]' \
              -c user.email='mioji.net@outlook.com' \
              commit --quiet -m 'chore(profile): refresh public metrics snapshot [skip ci]'
          # Concurrency serialises refreshes, so main can only have moved
          # because of a human push. Rebasing keeps that push; if both
          # touched generated files the rebase stops and the job fails,
          # and the run queued by that push renders a consistent state.
          git pull --rebase --quiet origin main
          git push --quiet origin HEAD:main
